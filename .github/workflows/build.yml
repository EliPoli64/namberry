name: Build, test and release

# Builds and tests NAMBerry on Linux, Windows and macOS on every branch push.
# Pushes to the mainline branch (master, or main if it exists) refresh the
# rolling stable release tagged `latest`. Pushes to any other branch refresh
# the rolling beta release tagged `beta`.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build, test and package (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git pkg-config zip xvfb \
            libasound2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libxrender-dev \
            libxfixes-dev libxau-dev libxdmcp-dev libxcb1-dev

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-8.0.6-${{ runner.os }}
          restore-keys: juce-8.0.6-${{ runner.os }}

      - name: Clone JUCE and DSP dependencies
        run: |
          mkdir -p deps
          if [ ! -d JUCE/.git ]; then
            git clone --depth 1 --branch 8.0.6 \
              https://github.com/juce-framework/JUCE.git JUCE
          fi
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/mikeoliphant/NeuralAudio.git deps/NeuralAudio
          git clone --depth 1 \
            https://github.com/signalsmith-audio/signalsmith-stretch.git \
            deps/signalsmith-stretch
          git clone --depth 1 \
            https://github.com/signalsmith-audio/linear.git \
            deps/signalsmith-linear

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Standalone, VST3 and test tools
        run: |
          cmake --build build --config Release --target \
            NAMBerry_Standalone NAMBerry_VST3 NAMBerryOfflineTest NAMBerryUiSnapshot \
            -j"$(nproc)"

      - name: Run offline DSP tests
        run: |
          set -euo pipefail
          TEST=build/NAMBerryOfflineTest_artefacts/Release/NAMBerryOfflineTest
          [ -x "$TEST" ] || TEST="$TEST.exe"

          echo "==> smoke"
          "$TEST"

          for mode in \
            reference reverb-dry reverb-ir reverb-ir-state \
            delay-feedback delay-reset delay-ping-pong delay-character \
            room chorus-ensemble modulation fx-state preset compressor \
            impersonator acoustic-sim acoustic-auto-off tone-match \
            ir-level ir-state post-eq post-eq-state spectrum dry-center \
            detector detected-stage pitch pitch-low pitch-robust pitch-blocks; do
            echo "==> $mode"
            "$TEST" "--$mode"
          done

      - name: Run UI snapshot
        run: |
          mkdir -p ui-snapshots
          xvfb-run -a build/NAMBerryUiSnapshot_artefacts/Release/NAMBerryUiSnapshot ui-snapshots
          ls -l ui-snapshots

      - name: Upload UI snapshots
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots-${{ github.ref_name }}-${{ github.run_id }}
          path: ui-snapshots/*.png
          if-no-files-found: error

      - name: Package release assets
        run: |
          set -euo pipefail

          mkdir -p dist/NAMberry-linux-standalone
          cp build/NAMBerry_artefacts/Release/Standalone/NAMberry \
            dist/NAMberry-linux-standalone/
          cp README.md LICENSE dist/NAMberry-linux-standalone/

          ( cd build/NAMBerry_artefacts/Release/VST3 \
              && zip -r "$GITHUB_WORKSPACE/dist/NAMberry-linux-vst3.zip" NAMberry.vst3 )

          ( cd dist \
              && zip -r NAMberry-linux-standalone.zip NAMberry-linux-standalone )

          rm -rf dist/NAMberry-linux-standalone
          ( cd dist && sha256sum ./*.zip > SHA256SUMS.txt )
          ls -l dist

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  build-portability:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-8.0.6-${{ runner.os }}
          restore-keys: juce-8.0.6-${{ runner.os }}

      - name: Clone JUCE and DSP dependencies
        shell: bash
        run: |
          mkdir -p deps
          if [ ! -d JUCE/.git ]; then
            git clone --depth 1 --branch 8.0.6 \
              https://github.com/juce-framework/JUCE.git JUCE
          fi
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/mikeoliphant/NeuralAudio.git deps/NeuralAudio
          git clone --depth 1 \
            https://github.com/signalsmith-audio/signalsmith-stretch.git \
            deps/signalsmith-stretch
          git clone --depth 1 \
            https://github.com/signalsmith-audio/linear.git \
            deps/signalsmith-linear

      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Standalone, VST3 and offline test tool
        shell: bash
        run: |
          cmake --build build --config Release --target \
            NAMBerry_Standalone NAMBerry_VST3 NAMBerryOfflineTest \
            -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)"

      - name: Run offline DSP tests
        shell: bash
        run: |
          set -euo pipefail
          TEST=build/NAMBerryOfflineTest_artefacts/Release/NAMBerryOfflineTest
          [ -x "$TEST" ] || TEST="$TEST.exe"

          echo "==> smoke"
          "$TEST"

          for mode in \
            reference reverb-dry reverb-ir reverb-ir-state \
            delay-feedback delay-reset delay-ping-pong delay-character \
            room chorus-ensemble modulation fx-state preset compressor \
            impersonator acoustic-sim acoustic-auto-off tone-match \
            ir-level ir-state post-eq post-eq-state spectrum dry-center \
            detector detected-stage pitch pitch-low pitch-robust pitch-blocks; do
            echo "==> $mode"
            "$TEST" "--$mode"
          done

  release-stable:
    name: Publish stable release
    needs: build-linux
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    permissions:
      contents: write
    concurrency:
      group: release-stable
      cancel-in-progress: false

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Publish rolling stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: NAMBerry stable (${{ github.ref_name }})
          make_latest: true
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            Stable Linux build from `${{ github.ref_name }}`.

            - Commit: [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            - Workflow run: [${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            Assets:
            - `NAMberry-linux-standalone.zip` — Standalone application (unzip, then `chmod +x NAMberry` if needed)
            - `NAMberry-linux-vst3.zip` — `NAMberry.vst3` bundle (copy into `~/.vst3`)
            - `SHA256SUMS.txt` — checksums
          files: dist/*

  release-beta:
    name: Publish beta release
    needs: build-linux
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main'
    permissions:
      contents: write
    concurrency:
      group: release-beta
      cancel-in-progress: false

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Publish rolling beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: NAMBerry beta (${{ github.ref_name }})
          make_latest: false
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            Beta Linux build from `${{ github.ref_name }}`.

            - Commit: [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            - Workflow run: [${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            Assets:
            - `NAMberry-linux-standalone.zip` — Standalone application (unzip, then `chmod +x NAMberry` if needed)
            - `NAMberry-linux-vst3.zip` — `NAMberry.vst3` bundle (copy into `~/.vst3`)
            - `SHA256SUMS.txt` — checksums
          files: dist/*
